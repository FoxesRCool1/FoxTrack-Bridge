<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Sign in · FoxTrack Bridge</title>
    <script>(function(){try{var m={light:'paper',dark:'ink',system:'paper',paper:'paper',ink:'ink',forest:'ink',dusk:'ink'};var t=m[localStorage.getItem('foxtrack.theme')]||'paper';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <link rel="stylesheet" href="/fonts.css">
    <style>
        /* The dashboard's tokens (web/ui.html); keep the two in step. */
        :root, [data-theme="paper"] {
            color-scheme: light;
            --bg: #f3ede0; --panel: rgb(60 45 30 / 5%); --surface: rgb(251 248 241);
            --border: rgb(60 45 30 / 14%); --text: #2b2118; --text-2: rgb(43 33 24 / 70%);
            --accent: #596640; --accent-2: #4a5436; --danger: #94432f; --radius: 12px;
        }
        [data-theme="ink"] {
            color-scheme: dark;
            --bg: #1a1a1c; --panel: rgb(255 255 255 / 5%); --surface: rgb(38 38 40);
            --border: rgb(255 255 255 / 10%); --text: #f2f2f0; --text-2: rgb(242 242 240 / 60%);
            --accent: #8698ad; --accent-2: #71849c; --danger: #e08a7b; --radius: 12px;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: var(--bg); color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex; align-items: center; justify-content: center;
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        }
        .card { width: 100%; max-width: 22rem; border: 1px solid var(--border); background: var(--panel); border-radius: var(--radius); padding: 1.75rem 1.5rem; }
        .brand { display: flex; align-items: center; gap: .625rem; margin-bottom: 1.25rem; }
        .brand img { width: 2rem; height: 2rem; }
        .logo-dark { display: none; }
        [data-theme="ink"] .logo-light { display: none; }
        [data-theme="ink"] .logo-dark { display: block; }
        h1 { font-family: 'Cormorant Garamond', 'Times New Roman', Georgia, serif; font-weight: 500; font-size: 1.5rem; line-height: 1.15; margin: 0; text-wrap: balance; }
        p { margin: .375rem 0 0; font-size: .875rem; color: var(--text-2); line-height: 1.45; }
        label { display: block; margin: 1.25rem 0 .375rem; font-size: .75rem; font-weight: 500; color: var(--text-2); }
        input[type=password] { display: block; width: 100%; height: 2.75rem; padding: 0 .75rem; border-radius: var(--radius); border: 1px solid var(--border); background: transparent; color: var(--text); font: inherit; font-size: 1rem; outline: none; }
        input[type=password]:focus { border-color: var(--accent); }
        .remember { display: flex; align-items: center; gap: .5rem; margin: .875rem 0 0; font-size: .8125rem; color: var(--text-2); font-weight: 400; min-height: 2.75rem; cursor: pointer; }
        .remember input { width: 1rem; height: 1rem; accent-color: var(--accent); margin: 0; }
        button { margin-top: .75rem; width: 100%; height: 2.75rem; border: 0; border-radius: var(--radius); background: var(--accent); color: var(--bg); font: inherit; font-size: .875rem; font-weight: 500; cursor: pointer; }
        button:hover { background: var(--accent-2); }
        button:disabled { opacity: .5; cursor: default; }
        button:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
        .error { min-height: 1.25rem; margin-top: .75rem; font-size: .8125rem; color: var(--danger); }
        .help { margin-top: 1.25rem; font-size: .75rem; }
        code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .75rem; background: var(--panel); border-radius: 4px; padding: .05rem .3rem; white-space: nowrap; }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">
            <img class="logo-light" src="/logo-light.png" alt="">
            <img class="logo-dark" src="/logo-dark.png" alt="">
            <h1>FoxTrack Bridge</h1>
        </div>
        <p>This Bridge has a password. Sign in to see your printers.</p>
        <form id="form" novalidate>
            <label for="pw">Password</label>
            <input id="pw" type="password" name="password" autocomplete="current-password" required autofocus>
            <label class="remember"><input id="remember" type="checkbox" checked> Keep me signed in on this device</label>
            <button id="go" type="submit">Sign in</button>
            <div id="err" class="error" role="alert" aria-live="polite"></div>
        </form>
        <p class="help">Forgot it? Stop the Bridge, run it once with <code>--reset-password</code>, then start it again.</p>
    </main>
    <script>
        const form = document.getElementById('form'), pw = document.getElementById('pw');
        const go = document.getElementById('go'), err = document.getElementById('err');
        form.addEventListener('submit', async e => {
            e.preventDefault();
            if (!pw.value) { err.textContent = 'Type the password.'; pw.focus(); return; }
            go.disabled = true; go.textContent = 'Signing in…'; err.textContent = '';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
                    body: JSON.stringify({ password: pw.value, remember: document.getElementById('remember').checked }),
                });
                if (res.ok) { location.replace('/'); return; }
                err.textContent = (await res.text()).trim() || 'Sign-in failed.';
                pw.select();
            } catch (_) {
                err.textContent = 'The Bridge did not answer. Is it still running?';
            }
            go.disabled = false; go.textContent = 'Sign in';
        });
    </script>
</body>
</html>
