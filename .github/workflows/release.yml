name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  create_release:
    name: Create release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

  build:
    name: Build ${{ matrix.os }}
    needs: create_release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset: FoxTrack-Bridge-Windows.exe

          - os: macos-intel
            runner: macos-latest
            goos: darwin
            goarch: amd64
            label: Intel
            asset: FoxTrack-Bridge-macOS-Intel.zip

          - os: macos-arm
            runner: macos-latest
            goos: darwin
            goarch: arm64
            label: Apple-Silicon
            asset: FoxTrack-Bridge-macOS-Apple-Silicon.zip

          - os: linux
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: FoxTrack-Bridge-Linux

          - os: linux-arm64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64
            asset: FoxTrack-Bridge-Linux-ARM64

          - os: linux-arm32
            runner: ubuntu-latest
            goos: linux
            goarch: arm
            asset: FoxTrack-Bridge-Linux-ARM32


    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          RAW="${GITHUB_REF_NAME}"
          CLEAN="${RAW#v}"
          echo "app_version=${CLEAN}" >> "$GITHUB_OUTPUT"

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing gcc

      # --- GUI builds (systray, CGO enabled) ---

      - name: Build (Windows GUI)
        if: matrix.os == 'windows'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 1
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        shell: pwsh
        run: go build -ldflags="-s -w -H windowsgui -X foxtrack-bridge/version.AppVersion=$env:APP_VERSION" -o FoxTrack-Bridge-Windows.exe .

      - name: Build (macOS GUI)
        if: matrix.os == 'macos-intel' || matrix.os == 'macos-arm'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          go build -ldflags="-s -w -X foxtrack-bridge/version.AppVersion=${APP_VERSION}" -o foxtrack-bridge-bin .

          APP_DIR="FoxTrack Bridge.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          cp foxtrack-bridge-bin "$APP_DIR/Contents/MacOS/foxtrack-bridge"
          chmod +x "$APP_DIR/Contents/MacOS/foxtrack-bridge"

          cat > "$APP_DIR/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>foxtrack-bridge</string>
            <key>CFBundleIdentifier</key>
            <string>studio.foxtrack.bridge</string>
            <key>CFBundleName</key>
            <string>FoxTrack Bridge</string>
            <key>CFBundleDisplayName</key>
            <string>FoxTrack Bridge</string>
            <key>CFBundleVersion</key>
            <string>${APP_VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${APP_VERSION}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSUIElement</key>
            <true/>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          codesign --deep --force --sign "-" "$APP_DIR"
          zip -r "${{ matrix.asset }}" "$APP_DIR" --quiet

      # --- Headless builds (no systray, CGO disabled) ---

      - name: Build (Linux amd64)
        if: matrix.os == 'linux'
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: go build -tags headless -ldflags="-s -w -X foxtrack-bridge/version.AppVersion=${APP_VERSION} -X foxtrack-bridge/version.AppBuildVariant=headless" -o FoxTrack-Bridge-Linux .

      - name: Build (Linux ARM64)
        if: matrix.os == 'linux-arm64'
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: go build -tags headless -ldflags="-s -w -X foxtrack-bridge/version.AppVersion=${APP_VERSION} -X foxtrack-bridge/version.AppBuildVariant=headless" -o FoxTrack-Bridge-Linux-ARM64 .

      - name: Build (Linux ARM32)
        if: matrix.os == 'linux-arm32'
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: 7
          CGO_ENABLED: 0
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: go build -tags headless -ldflags="-s -w -X foxtrack-bridge/version.AppVersion=${APP_VERSION} -X foxtrack-bridge/version.AppBuildVariant=headless" -o FoxTrack-Bridge-Linux-ARM32 .


      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

  checksums:
    name: Generate checksums
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Generate and upload checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern 'FoxTrack-Bridge-*' --dir assets
          (cd assets && sha256sum *) > checksums.txt
          gh release upload "${GITHUB_REF_NAME}" checksums.txt --repo "${GITHUB_REPOSITORY}" --clobber
