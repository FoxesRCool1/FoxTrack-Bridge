name: Test

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Vet and test (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # Most root-package tests carry //go:build headless, so the tag is required
      # or go test silently skips them.
      - name: Vet
        run: go vet -tags headless ./...

      - name: Test
        run: go test -tags headless -race ./...
