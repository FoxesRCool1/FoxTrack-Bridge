name: Test

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Vet and test (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # Most root-package tests carry //go:build headless, so the tag is required
      # or go test silently skips them.
      - name: Vet
        run: go vet -tags headless ./...

      - name: Test
        run: go test -tags headless -race ./...

      - name: Check dashboard scripts
        run: for f in web/features/*.js; do node --check "$f"; done

      - name: Dashboard tests
        run: node --test web/tests/*.test.mjs
